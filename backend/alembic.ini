# Alembic config. The DB URL is injected at runtime from ALEMBIC_DATABASE_URL
# (the direct/session connection on port 5432) inside app/migrations/env.py,
# so we intentionally leave sqlalchemy.url blank here.
[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
