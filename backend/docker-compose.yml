# Local dev infra. Postgres/Auth/Storage are managed by Supabase (cloud),
# so we only need Redis locally for the IDP queue. The API and worker can be
# run on the host (uvicorn / rq) or containerised via the profiles below.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
